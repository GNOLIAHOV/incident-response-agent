apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-agent-config
  namespace: sre-agent
data:
  PORT: "8000"
  PYTHONUNBUFFERED: "1"
  GEMINI_MODEL: "gemini-2.5-flash"
  DEFAULT_TEMPERATURE: "0.2"
  TELEGRAM_ENABLED: "true"
  SQLITE_DB_PATH: "/app/data/incidents.db"
  GITHUB_OWNER: "your-github-org"
  GITHUB_DEFAULT_REPO: "incident-response-agent"
---
apiVersion: v1
kind: Secret
metadata:
  name: sre-agent-secrets
  namespace: sre-agent
type: Opaque
stringData:
  # Cung cấp các thông tin nhạy cảm của doanh nghiệp tại đây:
  GOOGLE_API_KEY: "AIzaSy..."
  GITHUB_TOKEN: "ghp_..."
  TELEGRAM_BOT_TOKEN: "123456:ABC..."
  TELEGRAM_CHAT_ID: "-100123456789"
  TELEGRAM_WEBHOOK_SECRET: ""
