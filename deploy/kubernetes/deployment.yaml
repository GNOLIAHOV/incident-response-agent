apiVersion: v1
kind: Namespace
metadata:
  name: sre-agent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sre-agent-data-pvc
  namespace: sre-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-response-agent
  namespace: sre-agent
  labels:
    app: incident-response-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: incident-response-agent
  template:
    metadata:
      labels:
        app: incident-response-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: agent
          image: incident-response-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: sre-agent-config
            - secretRef:
                name: sre-agent-secrets
          volumeMounts:
            - name: persistent-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: sre-agent-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: incident-response-agent-svc
  namespace: sre-agent
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: incident-response-agent
